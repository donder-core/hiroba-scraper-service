services:
  app:
    build: .
    ports:
      - "6614:6614"
    environment:
      - TAIKO_USERNAME=${TAIKO_USERNAME}
      - TAIKO_PASSWORD=${TAIKO_PASSWORD}
      - DATABASE_URL=postgres://${POSTGRES_USER:-hiroba}:${POSTGRES_PASSWORD:-hiroba}@db:5432/${POSTGRES_DB:-hiroba}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hiroba}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hiroba}
      - POSTGRES_DB=${POSTGRES_DB:-hiroba}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiroba} -d ${POSTGRES_DB:-hiroba}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
